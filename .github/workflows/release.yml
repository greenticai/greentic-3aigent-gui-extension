name: Release

# Publishes greentic.provider.aigent-gui to the Greentic Store when
# describe.json metadata.version changes on main, then pushes an audit tag.
#
# The trigger deliberately watches describe.json, NOT Cargo.toml: gtdx publishes
# at metadata.version, and a sibling repo once released fully green while putting
# the *old* version in the store because only Cargo.toml had been bumped.
# ci/check-version-sync.sh keeps the two from drifting apart.
#
# Manual workflow_dispatch with an explicit version is also supported.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)publish, e.g. 0.2.2. Required.'
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.diff.outputs.should_publish }}
      version: ${{ steps.diff.outputs.version }}
      tag: ${{ steps.diff.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: cargo-bins/cargo-binstall@main

      - name: Install gtdx
        run: cargo binstall -y --version "=1.2.22" greentic-extension-sdk-cli

      - name: Publish if the manifest version is not in the store
        id: diff
        shell: bash
        env:
          GTDX_TOKEN: ${{ secrets.GREENTIC_STORE_TOKEN }}
        run: |
          set -euo pipefail
          MANIFEST=provider-3aigent-gui/describe.json
          EXT_ID=$(jq -r '.metadata.id' "$MANIFEST")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            echo "==> manual dispatch for ${VERSION}"
          else
            VERSION=$(jq -r '.metadata.version // empty' "$MANIFEST")
            [ -n "$VERSION" ] || {
              echo "::warning::no metadata.version in ${MANIFEST} — skipping"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"; exit 0
            }
          fi

          # Ask the store, rather than diffing against HEAD~1. A release that
          # fails and is then fixed by a commit that does not touch the version
          # could otherwise never publish without burning a version number.
          gtdx registries add greentic-store https://store.greentic.cloud 2>/dev/null || true
          PUBLISHED=$(gtdx search "$EXT_ID" --registry greentic-store 2>/dev/null \
                      | awk -v id="$EXT_ID" '$1 == id {print $2; exit}')
          echo "  manifest : ${VERSION}"
          echo "  store    : ${PUBLISHED:-<none>}"

          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "==> ${VERSION} is already in the store — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::warning::Tag ${TAG} already exists — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "==> Publishing ${VERSION}"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"  >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"          >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to Greentic Store
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Versions agree before publishing
        run: bash ci/check-version-sync.sh

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Fetch the real runtime gtpack + stamp its digest
        working-directory: provider-3aigent-gui
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ci/fetch-runtime-pack.sh" runtime
          SHA=$(sha256sum runtime/provider.gtpack | awk '{print $1}')
          bash "$GITHUB_WORKSPACE/ci/stamp-gtpack-sha.sh" describe.json "$SHA"

      - name: Refuse to publish a placeholder runtime
        working-directory: provider-3aigent-gui
        # A placeholder installs cleanly and delivers nothing — the failure mode
        # that looks like success. Never let one reach the store.
        run: |
          set -euo pipefail
          size=$(stat -c%s runtime/provider.gtpack)
          [ "$size" -ge 100000 ] || {
              echo "::error::runtime/provider.gtpack is only ${size} bytes — that is a placeholder, not a pack"
              exit 1
          }
          echo "OK: runtime pack is ${size} bytes"

      - name: Pre-install wasm32-wasip2 on Rust 1.95
        # cargo-component build inside `gtdx publish` honors rust-toolchain.toml;
        # ensure the target exists regardless of the action's toolchain order.
        run: rustup target add --toolchain 1.95 wasm32-wasip2

      - uses: greenticai/greentic-designer-extension-action@v2
        with:
          store-url: https://store.greentic.cloud
          store-token: ${{ secrets.GREENTIC_STORE_TOKEN }}
          manifest: ./provider-3aigent-gui/Cargo.toml
          version: ${{ needs.detect.outputs.version }}
          # Exact, not a range. `^1.2` resolved to a build whose embedded
          # describe-v2 schema predates `contributions.messaging_channel`, so
          # the publish died inside gtdx before it ever reached the Store:
          #   /contributions: Additional properties are not allowed
          # 1.2.22 is the first published build that knows the field.
          gtdx-version: "=1.2.22"
          # greentic-ext-runtime refuses an extension whose describe.json
          # carries no signature, so an unsigned publish ships something no
          # host can load.
          signing-key-pem: ${{ secrets.EXT_SIGNING_KEY_PEM }}

  verify:
    name: Verify the store, not the exit code
    needs: [detect, publish]
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --version "=1.2.22" greentic-extension-sdk-cli

      - name: Store lists the new version
        # A green publish job is not proof. Today a run reported seven successful
        # publishes while the store kept the previous version.
        env:
          GTDX_TOKEN: ${{ secrets.GREENTIC_STORE_TOKEN }}
        run: |
          set -euo pipefail
          WANT="${{ needs.detect.outputs.version }}"
          gtdx registries add greentic-store https://store.greentic.cloud 2>/dev/null || true
          GOT=$(gtdx search greentic.provider.aigent-gui --registry greentic-store 2>&1 \
                | awk '/greentic\.provider\.aigent-gui/ {print $2; exit}')
          echo "  want: $WANT"
          echo "  got : ${GOT:-<nothing>}"
          [ "$GOT" = "$WANT" ] || {
              echo "::error::store reports '${GOT:-nothing}', expected '${WANT}'"
              exit 1
          }
          echo "✓ store shows ${WANT}"

  tag:
    name: Push audit tag
    needs: [detect, publish, verify]
    if: needs.detect.outputs.should_publish == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag and push
        run: |
          set -euo pipefail
          TAG="${{ needs.detect.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "✓ Tagged ${TAG}"
